name: "Pull Request"

on:
  pull_request:
    branches:
      - main
      - develop
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr-checks:
    name: PR Validation
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Check PR title
        uses: deepakputra/action-pr-title@master
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          regex: '^(feat|fix|docs|style|refactor|test|ci|chore)(\(.+\))?!?: .+$'
          
      - name: Check commit messages
        uses: gsactions/commit-message-checker@v1
        with:
          pattern: '^(feat|fix|docs|style|refactor|test|ci|chore)(\(.+\))?!?: .+$'
          error: 'Commit message does not follow conventional commits format'
          
      - name: Check for large files
        run: |
          # Fail if any file is larger than 100MB
          git diff --name-only HEAD~1 | while read file; do
            size=$(git cat-file -s :$file 2>/dev/null || echo 0)
            if [ $size -gt 104857600 ]; then
              echo "File $file is too large ($size bytes)"
              exit 1
            fi
          done
        continue-on-error: true

  code-review-required:
    name: Code Review Check
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    
    steps:
      - name: Check approval count
        run: |
          if [ ${{ github.event.pull_request.review_comments }} -lt 1 ]; then
            echo "Main branch requires at least 1 approval"
            exit 1
          fi
        continue-on-error: true

  stale-check:
    name: Check if PR is up to date
    runs-on: ubuntu-latest
    
    steps:
      - name: Check if up to date
        uses: actions/github-script@v6
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            if (!pr.mergeable_state || pr.mergeable_state === 'behind') {
              core.setFailed('PR is behind base branch. Please update.');
            }

  auto-assign:
    name: Auto Assign PR
    runs-on: ubuntu-latest
    
    steps:
      - name: Assign to author
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [context.actor]
            });

  comment-template:
    name: Add PR Template Comment
    runs-on: ubuntu-latest
    
    steps:
      - name: Comment PR
        uses: actions/github-script@v6
        with:
          script: |
            const body = `## PR Checklist
            
- [ ] Description of changes is clear
- [ ] Related issues linked
- [ ] Tests added/updated
- [ ] Documentation updated
- [ ] No breaking changes
- [ ] Code follows project style
- [ ] Commits follow conventional commits
            
## Description
            
<!-- Add detailed description here -->
            
## Related Issues
            
<!-- Link to related issues: Closes #123 -->
            
## Type of Change
            
- [ ] Bug fix
- [ ] New feature
- [ ] Breaking change
- [ ] Documentation update`;
            
            if (context.payload.pull_request.body === null || context.payload.pull_request.body.trim() === '') {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
