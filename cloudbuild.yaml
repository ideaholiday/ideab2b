options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'asia-south2-docker.pkg.dev/$PROJECT_ID/ideab2b/api:$COMMIT_SHA'
      - '-t'
      - 'asia-south2-docker.pkg.dev/$PROJECT_ID/ideab2b/api:latest'
      - '-f'
      - './Dockerfile'
      - '.'
    dir: 'backend'

  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'asia-south2-docker.pkg.dev/$PROJECT_ID/ideab2b/web:$COMMIT_SHA'
      - '-t'
      - 'asia-south2-docker.pkg.dev/$PROJECT_ID/ideab2b/web:latest'
      - '-f'
      - './Dockerfile'
      - '.'
    dir: 'frontend'

  # Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - 'asia-south2-docker.pkg.dev/$PROJECT_ID/ideab2b/api:$COMMIT_SHA'
    waitFor: ['build-backend']

  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - 'asia-south2-docker.pkg.dev/$PROJECT_ID/ideab2b/web:$COMMIT_SHA'
    waitFor: ['build-frontend']

  # Deploy backend to Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    id: 'deploy-backend'
    args:
      - 'deploy'
      - 'ideab2b-api'
      - '--image=asia-south2-docker.pkg.dev/$PROJECT_ID/ideab2b/api:$COMMIT_SHA'
      - '--region=asia-south2'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=APP_ENV=production'
      - '--memory=2Gi'
      - '--cpu=2'
    env:
      - 'CLOUDSDK_RUN_REGION=asia-south2'
    waitFor: ['push-backend']

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    id: 'deploy-frontend'
    args:
      - 'deploy'
      - 'ideab2b-web'
      - '--image=asia-south2-docker.pkg.dev/$PROJECT_ID/ideab2b/web:$COMMIT_SHA'
      - '--region=asia-south2'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
    env:
      - 'CLOUDSDK_RUN_REGION=asia-south2'
    waitFor: ['push-frontend']

images:
  - 'asia-south2-docker.pkg.dev/$PROJECT_ID/ideab2b/api:$COMMIT_SHA'
  - 'asia-south2-docker.pkg.dev/$PROJECT_ID/ideab2b/web:$COMMIT_SHA'
  - 'asia-south2-docker.pkg.dev/$PROJECT_ID/ideab2b/api:latest'
  - 'asia-south2-docker.pkg.dev/$PROJECT_ID/ideab2b/web:latest'

timeout: '3600s'
