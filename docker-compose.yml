version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: ideab2b-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ideab2b}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_USER: ${DB_USERNAME:-ideab2b}
      MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Laravel API Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ideab2b-api
    restart: unless-stopped
    working_dir: /app
    environment:
      APP_NAME: IdeaB2B
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ideab2b}
      DB_USERNAME: ${DB_USERNAME:-ideab2b}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${API_PORT:-8000}:8080"
    volumes:
      - ./backend:/app
      - /app/vendor
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - travel-network
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8080"

  # React Frontend
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ideab2b-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api
    networks:
      - travel-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ideab2b-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5

  # Nginx Proxy (optional, for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: ideab2b-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.proxy.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    networks:
      - travel-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  travel-network:
    driver: bridge
